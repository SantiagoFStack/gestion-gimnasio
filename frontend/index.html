<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Gimnasio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh">
  <div class="card p-4 shadow-sm" style="width: 360px">
    <h3 class="mb-4 text-center">Gimnasio</h3>
    <form id="form-login">
      <label class="form-label">Usuario</label>
      <input id="usuario" class="form-control mb-3">
      <label class="form-label">Contraseña</label>
      <input id="password" type="password" class="form-control mb-3">
      <button class="btn btn-primary w-100">Entrar</button>
      <p id="error" class="text-danger mt-3 mb-0"></p>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
