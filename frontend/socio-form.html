<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Socio · Gimnasio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <nav class="menu">
      <h4>Gimnasio</h4>
      <a href="dashboard.html">Inicio</a>
      <a href="socios.html" class="activo">Socios</a>
      <a href="planes.html">Planes</a>
      <a href="pago.html">Registrar pago</a>
      <a href="index.html">Cerrar sesión</a>
    </nav>
    <main class="contenido">
      <h2 id="titulo">Nuevo socio</h2>

      <form id="form-socio" class="card p-4 mt-3" style="max-width: 520px">
        <label class="form-label">DNI *</label>
        <input id="dni" class="form-control mb-3" required>

        <label class="form-label">Nombre *</label>
        <input id="nombre" class="form-control mb-3" required>

        <label class="form-label">Apellido *</label>
        <input id="apellido" class="form-control mb-3" required>

        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control mb-3">

        <label class="form-label">Teléfono</label>
        <input id="telefono" class="form-control mb-3">

        <p id="error" class="text-danger"></p>

        <div class="d-flex gap-2">
          <button class="btn btn-primary">Guardar</button>
          <a href="socios.html" class="btn btn-secondary">Cancelar</a>
        </div>
      </form>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/socio-form.js"></script>
</body>
</html>
