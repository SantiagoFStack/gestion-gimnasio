<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes · Gimnasio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex">
    <nav class="menu">
      <h4>Gimnasio</h4>
      <a href="dashboard.html">Inicio</a>
      <a href="socios.html">Socios</a>
      <a href="planes.html" class="activo">Planes</a>
      <a href="pago.html">Registrar pago</a>
      <a href="index.html">Cerrar sesión</a>
    </nav>
    <main class="contenido">
      <h2>Planes</h2>

      <div class="row g-4 mt-1">
        <div class="col-md-7">
          <table class="table table-hover bg-white">
            <thead>
              <tr><th>Plan</th><th>Duración</th><th>Precio</th><th></th></tr>
            </thead>
            <tbody id="tabla-planes"></tbody>
          </table>
        </div>

        <div class="col-md-5">
          <form id="form-plan" class="card p-4">
            <h5 id="titulo-form">Nuevo plan</h5>

            <label class="form-label">Nombre</label>
            <input id="nombre" class="form-control mb-3" required>

            <label class="form-label">Duración (días)</label>
            <input id="duracionDias" type="number" min="1" class="form-control mb-3" required>

            <label class="form-label">Precio</label>
            <input id="precio" type="number" min="1" class="form-control mb-3" required>

            <div class="d-flex gap-2">
              <button class="btn btn-primary">Guardar</button>
              <button type="button" id="cancelar" class="btn btn-secondary">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/planes.js"></script>
</body>
</html>
