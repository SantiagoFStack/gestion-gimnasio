# Despertador: llama a la API cada 10 minutos para que Render no la duerma
# (en el plan gratis se apaga tras 15 min sin visitas y tarda ~50 s en volver).
# /api/salud es pública y consulta la base de datos, así que también mantiene despierta la base de Aiven.
# Además, el plan gratis de Aiven apaga la base por inactividad y no se enciende sola:
# si la encuentra apagada, la enciende con la API de Aiven (secreto AIVEN_TOKEN).
name: Mantener despierta la API

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 minutos (hora UTC)
  workflow_dispatch:         # permite lanzarlo a mano desde la pestaña Actions

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encender la base de Aiven si está apagada
        env:
          AIVEN_TOKEN: ${{ secrets.AIVEN_TOKEN }}
          SERVICIO: https://api.aiven.io/v1/project/gestion-gimnasio/service/gimnasio-db
        run: |
          if [ -z "$AIVEN_TOKEN" ]; then
            echo "Falta el secreto AIVEN_TOKEN: no se puede revisar Aiven"
            exit 0
          fi
          estado=$(curl -fsS -H "Authorization: aivenv1 $AIVEN_TOKEN" "$SERVICIO" | jq -r '.service.state')
          echo "Estado de la base en Aiven: $estado"
          if [ "$estado" = "POWEROFF" ]; then
            curl -fsS -X PUT -H "Authorization: aivenv1 $AIVEN_TOKEN" -H "Content-Type: application/json" \
                 -d '{"powered": true}' "$SERVICIO" -o /dev/null
            echo "Estaba apagada: encendiéndola (tarda unos 5 minutos)"
          fi

      - name: Llamar a la API
        run: |
          for intento in 1 2 3; do
            if curl -fsS --max-time 90 -o /dev/null https://gimnasio-api-imsn.onrender.com/api/salud; then
              echo "API despierta"
              exit 0
            fi
            echo "Intento $intento sin respuesta, reintento en 20 s"
            sleep 20
          done
          echo "La API no respondió en 3 intentos"
          exit 1
