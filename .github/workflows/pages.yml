# Publica la carpeta frontend/ en GitHub Pages cada vez que cambia en main.
# La web queda en https://santiagofstack.github.io/gestion-gimnasio/
name: Publicar el frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:   # permite publicarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Bajar el código del repo
        uses: actions/checkout@v5

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la carpeta frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
